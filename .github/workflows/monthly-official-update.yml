name: Monthly official data update

on:
  schedule:
    - cron: "30 3 5 * *"
  workflow_dispatch:
    inputs:
      approve_review_fingerprint:
        description: "SHA-256 one-shot approval for the exact reviewed official_numbers_fr diff"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: monthly-official-update
  cancel-in-progress: false

jobs:
  check-official-data:
    name: Check official datasets
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare temporary signing key when available
        shell: pwsh
        env:
          OFFICIAL_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.OFFICIAL_UPDATE_PRIVATE_KEY_PEM }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:OFFICIAL_UPDATE_PRIVATE_KEY_PEM)) {
            $keyFile = Join-Path $env:RUNNER_TEMP "official_update_private_key.pem"
            [System.IO.File]::WriteAllText($keyFile, $env:OFFICIAL_UPDATE_PRIVATE_KEY_PEM, [System.Text.Encoding]::ASCII)
            "OFFICIAL_UPDATE_PRIVATE_KEY_FILE=$keyFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Check official rule sources and official numbers
        shell: pwsh
        env:
          APPROVE_REVIEW_FINGERPRINT: ${{ github.event.inputs.approve_review_fingerprint || '' }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
        run: |
          $arguments = @("tools/monthly_official_update.py", "--build-official-numbers", "--publish")
          if ($env:WORKFLOW_EVENT_NAME -eq "workflow_dispatch") {
            $arguments += "--workflow-dispatch"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:APPROVE_REVIEW_FINGERPRINT)) {
            $arguments += "--approve-review-fingerprint"
            $arguments += $env:APPROVE_REVIEW_FINGERPRINT
          }
          python @arguments

      - name: Verify current public update set
        shell: pwsh
        run: |
          ./tools/verify_update.ps1

      - name: Confirm no APK is published
        shell: pwsh
        run: |
          $scanRoot = "."
          if (Test-Path -LiteralPath "public") {
            $scanRoot = "public"
          }
          $apkFiles = @(
            Get-ChildItem -LiteralPath $scanRoot -Recurse -File -Filter "*.apk" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "\\.git\\" }
          )
          if ($apkFiles.Count -gt 0) {
            Write-Error ("APK found in publication tree: " + ($apkFiles.FullName -join ", "))
            exit 1
          }
          Write-Output "No APK found in publication tree."
          exit 0

      - name: Cleanup temporary signing key
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:OFFICIAL_UPDATE_PRIVATE_KEY_FILE) -and (Test-Path -LiteralPath $env:OFFICIAL_UPDATE_PRIVATE_KEY_FILE)) {
            Remove-Item -LiteralPath $env:OFFICIAL_UPDATE_PRIVATE_KEY_FILE -Force
          }
